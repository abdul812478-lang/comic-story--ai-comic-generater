<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComicCraft - AI Comic Creator</title>
    <style>
        :root {
            --paper: #fff9ef;
            --ink: #121212;
            --sun: #ffd75b;
            --red: #ff5c5c;
            --blue: #4cb9ff;
            --yellow: #ffe07a;
            --shadow: #161616;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top, rgba(255, 223, 113, 0.9), transparent 30%),
                linear-gradient(135deg, #f4d35e 0%, #f4b2a7 22%, #f9efe5 100%);
            color: var(--ink);
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
            background: var(--paper);
            border: 5px solid var(--ink);
            box-shadow: 12px 12px 0 var(--shadow);
            border-radius: 22px;
            padding: 28px 28px 36px;
            transform: rotate(-0.6deg);
        }

        h1 {
            margin: 0 0 8px;
            text-align: center;
            font-size: clamp(2.3rem, 4vw, 3.2rem);
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 3px 3px 0 #f8c64d;
        }

        .subtitle {
            margin: 0 0 22px;
            text-align: center;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 1.2px;
        }

        form {
            display: grid;
            gap: 14px;
        }

        label {
            display: block;
            font-weight: 900;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 14px 16px;
            margin-top: 6px;
            border: 4px solid var(--ink);
            border-radius: 12px;
            font-size: 1rem;
            background: #fff;
            outline: none;
            box-shadow: 4px 4px 0 rgba(18,18,18,0.18);
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        button {
            margin-top: 12px;
            padding: 18px 20px;
            border: 4px solid var(--ink);
            border-radius: 14px;
            background: linear-gradient(180deg, #ff6b6b, #ef4d4d);
            color: white;
            font-size: 1.1rem;
            font-weight: 900;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 6px 6px 0 var(--shadow);
            transition: transform 0.15s ease;
        }

        button:hover {
            transform: translate(-2px, -2px);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🎨 ComicCraft</h1>
        <p class="subtitle">Create your own AI-powered comic.</p>

        <form action="/generate" method="post">
            <div>
                <label>Story Prompt</label>
                <textarea name="story_prompt" placeholder="A brave fox exploring an enchanted forest..." required></textarea>
            </div>

            <div>
                <label>Main Character Name</label>
                <input type="text" name="character_name" placeholder="Alex" required>
            </div>

            <div>
                <label>Setting</label>
                <select name="setting">
                    <option value="forest">Forest</option>
                    <option value="school">School</option>
                    <option value="space">Space</option>
                    <option value="city">City</option>
                </select>
            </div>

            <div>
                <label>Story Tone</label>
                <select name="tone">
                    <option value="light-hearted">Light-hearted</option>
                    <option value="dramatic">Dramatic</option>
                    <option value="poetic">Poetic</option>
                    <option value="funny">Funny</option>
                </select>
            </div>

            <div>
                <label>Art Style</label>
                <select name="art_style">
                    <option value="anime">Anime</option>
                    <option value="pixel art">Pixel Art</option>
                    <option value="comic book">Comic Book</option>
                    <option value="realistic">Realistic</option>
                </select>
            </div>

            <button type="submit">Generate My Comic 🚀</button>
        </form>
    </div>
</body>
</html>
